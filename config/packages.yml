# =============================================================================
#  ImmortalWrt x86_64 固件 —— 插件清单
# =============================================================================
#  这是整份构建配置里唯一需要日常修改的文件。
#  改完直接去 Actions → Run workflow，不需要动 workflow 里的任何东西。
#
#  规则：
#    · 每行一个包名，写的是 opkg/apk 的包名（不是文件名）
#    · 以 "#" 开头 = 不编译；把 "#" 删掉 = 参与编译
#    · 以 "-" 开头 = 从固件里移除该包（如 "-dnsmasq"）
#    · 想整组关闭，把组名和下面的行一起注释掉即可
#
#  下面所有取消注释的包，都已确认存在于 ImmortalWrt 官方源
#  （openwrt-24.10 与 openwrt-25.12 两个分支都有）。少数标注了版本限制。
# =============================================================================


# -----------------------------------------------------------------------------
# 1. 基础组件（官方源，默认全装，一般不用动）
# -----------------------------------------------------------------------------
base:
  - curl
  - ca-bundle
  - bash
  - ip-full
  - unzip
  - coreutils-nohup
  - ruby
  - ruby-yaml
  - openssh-sftp-server
  - kmod-tun
  - kmod-inet-diag
  - kmod-nft-tproxy
  - kmod-nft-socket
  - luci-compat
  - luci-theme-argon
  - luci-app-argon-config
  - luci-i18n-argon-config-zh-cn
  - luci-i18n-base-zh-cn
  - luci-i18n-firewall-zh-cn
  - luci-i18n-diskman-zh-cn
  - luci-i18n-package-manager-zh-cn
  - luci-i18n-ttyd-zh-cn
  - luci-i18n-filemanager-zh-cn
  # 换掉精简版 dnsmasq，装带完整功能的版本
  - "-dnsmasq"
  - dnsmasq-full


# -----------------------------------------------------------------------------
# 2. 分组插件
#    这里的组没有开关，删掉注释就生效、整组注释就关闭。
#    只要组里还有至少一个未注释的包，这个组就算启用。
# -----------------------------------------------------------------------------
groups:

  # ===========================================================================
  # 代理 / 分流
  # ===========================================================================
  proxy:
    - luci-app-openclash
    - nikki
    - luci-app-nikki
    - luci-i18n-nikki-zh-cn
    - momo
    - luci-app-momo
    - luci-i18n-momo-zh-cn
    - luci-app-homeproxy
    - luci-i18n-homeproxy-zh-cn
    - sing-box

    # 以下代理插件按需取消注释（同一时间建议只留一个接管流量）
    # - luci-app-passwall
    # - luci-i18n-passwall-zh-cn
    # - luci-app-dae
    # - luci-i18n-dae-zh-cn
    # - luci-app-smartdns
    # - luci-i18n-smartdns-zh-cn
    # - luci-app-https-dns-proxy
    # - luci-i18n-https-dns-proxy-zh-cn
    # - luci-app-zerotier
    # - luci-i18n-zerotier-zh-cn

  # ===========================================================================
  # 流量 / 状态监控
  # ===========================================================================
  monitor:
    # bandix 后端 + LuCI 前端（前端在独立仓库，见下面的 github_releases）
    - bandix
    - luci-app-bandix
    - luci-i18n-bandix-zh-cn

    # - luci-app-netdata
    # - luci-i18n-netdata-zh-cn
    # - luci-app-nlbwmon
    # - luci-i18n-nlbwmon-zh-cn
    # - luci-app-vnstat2
