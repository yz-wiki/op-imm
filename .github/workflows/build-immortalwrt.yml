name: Build ImmortalWrt x86_64

# 用官方 ImageBuilder 打包 x86_64 固件，不编译源码，一次 8~20 分钟。
# 插件清单在 config/packages.yml 里改，workflow 本身不需要动。
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "ImmortalWrt 版本（25.12.x = apk，24.10.x = ipk）"
        required: true
        type: choice
        default: "24.10.6"
        options:
          - "24.10.6"
          - "25.12.2"
          - "25.12.1"
          - "25.12.0"

      custom_router_ip:
        description: "路由器后台地址"
        required: true
        type: string
        default: "10.10.1.1"

      rootfs_size:
        description: "软件包空间：可直接选 2G/3G/4G，也可手填数字+单位（如 2048M、2G、4G）"
        required: false
        type: string
        default: "2G"

      filesystem:
        description: "img 固件的文件系统"
        required: false
        type: choice
        default: "both"
        options:
          - "both"
          - "squashfs"
          - "ext4"

      # ---- 固件格式（勾选式，默认只出 img） ----
      img:
        description: "固件格式：img 系统镜像（默认）"
        required: false
        type: boolean
        default: true

      iso:
        description: "固件格式：iso 光盘镜像（虚拟机用）"
        required: false
        type: boolean
        default: false

      qcow2:
        description: "固件格式：qcow2（KVM / PVE 虚拟机）"
        required: false
        type: boolean
        default: false

      vmdk:
        description: "固件格式：vmdk（VMware 虚拟机）"
        required: false
        type: boolean
        default: false

      vdi:
        description: "固件格式：vdi（VirtualBox 虚拟机）"
        required: false
        type: boolean
        default: false

      vhdx:
        description: "固件格式：vhdx（Hyper-V 虚拟机）"
        required: false
        type: boolean
        default: false

      # ---- PPPoE：两项都填才生效，否则 WAN 走 DHCP ----
      pppoe_account:
        description: "PPPoE 宽带账号（留空 = WAN 用 DHCP）"
        required: false
        type: string

      pppoe_password:
        description: "PPPoE 宽带密码（与账号同时填写才生效）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-immortalwrt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 x86_64 固件
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- 参数 --
      - name: 解析参数
        env:
          LUCI_VERSION: ${{ inputs.luci_version }}
          ROUTER_IP: ${{ inputs.custom_router_ip }}
          ROOTFS_IN: ${{ inputs.rootfs_size }}
          FILESYSTEM_IN: ${{ inputs.filesystem }}
          FMT_IMG: ${{ inputs.img }}
          FMT_ISO: ${{ inputs.iso }}
          FMT_QCOW2: ${{ inputs.qcow2 }}
          FMT_VMDK: ${{ inputs.vmdk }}
          FMT_VDI: ${{ inputs.vdi }}
          FMT_VHDX: ${{ inputs.vhdx }}
          PPPOE_ACCOUNT_IN: ${{ inputs.pppoe_account }}
          PPPOE_PASSWORD_IN: ${{ inputs.pppoe_password }}
        run: |
          set -euo pipefail

          case "$LUCI_VERSION" in
            25.12*) PKG=apk;  BRANCH=openwrt-25.12 ;;
            24.10*) PKG=ipk;  BRANCH=openwrt-24.10 ;;
            *) echo "::error::不支持的版本 $LUCI_VERSION"; exit 1 ;;
          esac

          # ---- 空间：支持 2G / 3G / 4G / 2048 / 2048M / 4GB ----
          v="$(printf '%s' "${ROOTFS_IN:-2G}" | tr 'A-Z' 'a-z' | tr -d ' ')"
          case "$v" in
            *gb) n="${v%gb}"; mult=1024 ;;
            *mb) n="${v%mb}"; mult=1 ;;
            *g)  n="${v%g}";  mult=1024 ;;
            *m)  n="${v%m}";  mult=1 ;;
            *)   n="$v";      mult=1 ;;
          esac
          case "$n" in
            ''|*[!0-9]*) echo "::error::软件包空间无法识别：${ROOTFS_IN}（可填 2G / 3G / 4G / 2048 / 2048M）"; exit 1 ;;
          esac
          ROOTFS_SIZE=$((n * mult))
          if [ "$ROOTFS_SIZE" -lt 64 ] || [ "$ROOTFS_SIZE" -gt 16384 ]; then
            echo "::error::软件包空间 ${ROOTFS_SIZE}MB 超出范围（64 ~ 16384MB）"; exit 1
          fi

          # ---- 格式：勾选的都出，全不勾时兜底为 img ----
          FMT=""
          [ "${FMT_IMG:-false}"   = "true" ] && FMT="$FMT img"
          [ "${FMT_ISO:-false}"   = "true" ] && FMT="$FMT iso"
          [ "${FMT_QCOW2:-false}" = "true" ] && FMT="$FMT qcow2"
          [ "${FMT_VMDK:-false}"  = "true" ] && FMT="$FMT vmdk"
          [ "${FMT_VDI:-false}"   = "true" ] && FMT="$FMT vdi"
          [ "${FMT_VHDX:-false}"  = "true" ] && FMT="$FMT vhdx"
          FMT="$(printf '%s' "$FMT" | sed 's/^ *//; s/ *$//; s/ \+/,/g')"
          [ -z "$FMT" ] && FMT="img"

          case "${FILESYSTEM_IN:-both}" in
            both|squashfs|ext4) FILESYSTEM="${FILESYSTEM_IN:-both}" ;;
            *) echo "::error::未知文件系统 ${FILESYSTEM_IN}"; exit 1 ;;
          esac

          # ---- PPPoE：账号密码都填才启用，否则 WAN 保持 DHCP ----
          ENABLE_PPPOE=false
          PPPOE_ACCOUNT="${PPPOE_ACCOUNT_IN:-}"
          PPPOE_PASSWORD="${PPPOE_PASSWORD_IN:-}"
          if [ -n "$PPPOE_ACCOUNT" ] && [ -n "$PPPOE_PASSWORD" ]; then
            ENABLE_PPPOE=true
          elif [ -n "$PPPOE_ACCOUNT" ] || [ -n "$PPPOE_PASSWORD" ]; then
            echo "::warning::PPPoE 账号与密码需要同时填写，本次已忽略，WAN 使用 DHCP"
            PPPOE_ACCOUNT=""; PPPOE_PASSWORD=""
          fi

          {
            echo "VER=$LUCI_VERSION"
            echo "PKG=$PKG"
            echo "BRANCH=$BRANCH"
            echo "ROOTFS_SIZE=$ROOTFS_SIZE"
            echo "FILESYSTEM=$FILESYSTEM"
            echo "FORMATS=$FMT"
            echo "ROUTER_IP=$ROUTER_IP"
            echo "ENABLE_PPPOE=$ENABLE_PPPOE"
            echo "PPPOE_ACCOUNT=$PPPOE_ACCOUNT"
            echo "PPPOE_PASSWORD=$PPPOE_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "版本 $LUCI_VERSION（$PKG / $BRANCH）"
          echo "空间 ${ROOTFS_SIZE}MB，格式 $FMT，后台 $ROUTER_IP"
          echo "PPPoE 预置：$ENABLE_PPPOE"

      # ---------------------------------------------------------------- 计划 --
      - name: 生成构建计划（读取 config/packages.yml）
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null \
            || pip3 install --quiet --disable-pip-version-check pyyaml \
            || pip3 install --quiet --break-system-packages pyyaml
          python3 scripts/plan.py

      # ------------------------------------------------------------ 下载 IB --
      - name: 下载并解压官方 ImageBuilder
        run: |
          set -euo pipefail
          URL="https://downloads.immortalwrt.org/releases/${VER}/targets/x86/64/immortalwrt-imagebuilder-${VER}-x86-64.Linux-x86_64.tar.zst"
          echo "下载 $URL"
          curl -fL --retry 3 --retry-delay 5 -o ib.tar.zst "$URL"
          tar --zstd -xf ib.tar.zst
          mv immortalwrt-imagebuilder-* ib
          rm -f ib.tar.zst
          mkdir -p ib/keys
          ls -d ib

      # -------------------------------------------------------------- feeds --
      - name: 接入第三方源与公钥
        run: |
          set -euo pipefail
          if [ "$PKG" = "apk" ]; then
            # apk：公钥文件名随意，apk 只比对内容
            while IFS=$'\t' read -r name url key; do
              [ -z "$name" ] && continue
              echo "$url" >> ib/repositories
              if [ -n "$key" ]; then
                curl -fsSL --retry 3 -o "ib/keys/${name}.pem" "$key" \
                  || { echo "::error::${name} 公钥下载失败: $key"; exit 1; }
                echo "  源 $name 已接入（apk，公钥 keys/${name}.pem）"
              else
                echo "  源 $name 已接入（apk，无公钥）"
              fi
            done < <(jq -r '.feeds[] | [.name, .url, .key] | @tsv' /tmp/plan.json)
          else
            # opkg：公钥必须命名为 usign 指纹，否则验签必然失败
            export PATH="$PWD/ib/staging_dir/host/bin:$PATH"
            while IFS=$'\t' read -r name url key; do
              [ -z "$name" ] && continue
              printf 'src/gz %s %s\n' "$name" "$url" >> ib/repositories.conf
              if [ -n "$key" ]; then
                tmp="ib/keys/.${name}.pub.tmp"
                curl -fsSL --retry 3 -o "$tmp" "$key" \
                  || { echo "::error::${name} 公钥下载失败: $key"; exit 1; }
                fp="$(usign -F -p "$tmp" || true)"
                if [ -z "$fp" ]; then
                  echo "::error::${name} 公钥解析不出指纹: $key"; exit 1
                fi
                mv -f "$tmp" "ib/keys/$fp"
                echo "  源 $name 已接入（ipk，公钥指纹 $fp）"
              else
                echo "  源 $name 已接入（ipk，无公钥）"
              fi
            done < <(jq -r '.feeds[] | [.name, .url, .key] | @tsv' /tmp/plan.json)
          fi

      # ------------------------------------------------------- uci-defaults --
      - name: 写入默认配置（后台地址 / 语言 / PPPoE）
        run: |
          set -euo pipefail
          # 单引号转义，避免密码里的特殊字符破坏生成的脚本
          esc() { printf '%s' "$1" | sed "s/'/'\\\\''/g"; }

          mkdir -p ib/files/etc/uci-defaults
          S=ib/files/etc/uci-defaults/99-custom.sh

          {
            echo '#!/bin/sh'
            echo '# 由 GitHub Actions 生成，首次开机执行一次后自动删除'
            echo 'uci set luci.main.lang="zh_cn"'
            echo 'uci set luci.main.mediaurlbase="/luci-static/argon"'
            echo 'uci set luci.themes.Argon="/luci-static/argon"'
            echo 'uci set network.lan.proto="static"'
            printf 'uci set network.lan.ipaddr="%s"\n' "$(esc "$ROUTER_IP")"
            echo 'uci set network.lan.netmask="255.255.255.0"'
            if [ "$ENABLE_PPPOE" = "true" ]; then
              echo 'uci set network.wan.proto="pppoe"'
              printf 'uci set network.wan.username="%s"\n' "$(esc "$PPPOE_ACCOUNT")"
              printf 'uci set network.wan.password="%s"\n' "$(esc "$PPPOE_PASSWORD")"
              echo 'uci set network.wan.ipv6="auto"'
              echo 'uci -q delete network.wan6 || true'
            fi
            echo 'uci commit'
            echo 'exit 0'
          } > "$S"

          chmod +x "$S"
          echo "----- $S -----"
          cat "$S"

      # ---------------------------------------------------- GitHub release --
      - name: 下载 GitHub Release 插件
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ib/packages
          TOKEN="${GITHUB_TOKEN:-}"

          api() {
            if [ -n "$TOKEN" ]; then
              curl -fsSL --retry 3 -H "Authorization: Bearer $TOKEN" "$1"
            else
              curl -fsSL --retry 3 "$1"
            fi
          }

          # 从资产列表里挑出属于 $pkg 的那一个；优先 x86_64 / all
          pick() {
            best="$(printf '%s\n' "$1" | grep -E "/${2}[-_][^/]*\.${PKG}$" | grep -E "x86_64|all" | head -1)"
            if [ -z "$best" ]; then
              best="$(printf '%s\n' "$1" | grep -E "/${2}[-_][^/]*\.${PKG}$" | head -1)"
            fi
            printf '%s\n' "$best"
          }

          set +e
          jq -r '.releases[] | [.package, .repo, .tag, (.required|tostring)] | @tsv' /tmp/plan.json \
            | while IFS=$'\t' read -r pkg repo tag required; do
                [ -z "$pkg" ] && continue
                echo "→ $pkg  ($repo @ $tag)"

                if [ "$tag" = "latest" ]; then
                  list="$(api "https://api.github.com/repos/${repo}/releases/latest" 2>/dev/null \
                          | jq -r '.assets[].browser_download_url' 2>/dev/null)"
                else
                  list="$(api "https://api.github.com/repos/${repo}/releases/tags/${tag}" 2>/dev/null \
                          | jq -r '.assets[].browser_download_url' 2>/dev/null)"
                fi
                url="$(pick "$list" "$pkg")"

                # 最新版里没有 → 往最近 30 个 release 里翻（上游常把后端和前端分开发版）
                if [ -z "$url" ] && [ "$tag" = "latest" ]; then
                  list="$(api "https://api.github.com/repos/${repo}/releases?per_page=30" 2>/dev/null \
                          | jq -r '.[].assets[].browser_download_url' 2>/dev/null)"
                  url="$(pick "$list" "$pkg")"
                fi

                if [ -z "$url" ]; then
                  if [ "$required" = "true" ]; then
                    echo "::error::${pkg} 在 ${repo} 里找不到可用的 .${PKG} 资产"
                    exit 1
                  fi
                  echo "  ⚠️  没找到，跳过"
                  continue
                fi

                f="ib/packages/$(basename "$url")"
                rm -f "$f"
                if curl -fsSL --retry 3 -o "$f" "$url"; then
                  echo "  ✓ $(basename "$f")"
                else
                  rm -f "$f"
                  if [ "$required" = "true" ]; then
                    echo "::error::下载失败 $url"
                    exit 1
                  fi
                  echo "  ⚠️  下载失败，跳过"
                fi
              done
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::插件下载阶段失败"
            exit "$rc"
          fi

      - name: 规范化 apk 文件名（25.12 命名规则）
        run: |
          if [ "$PKG" = "apk" ]; then
            bash scripts/fix-apk-names.sh ib/packages
          else
            echo "ipk 不需要改文件名"
          fi

      - name: 剔除没下到的可选插件
        run: python3 scripts/prune.py ib/packages

      # -------------------------------------------------------------- build --
      - name: 构建固件
        run: |
          set -euo pipefail
          cd ib

          # 先全部关掉虚拟盘格式，再按用户勾选打开
          sed -i -E 's/^(CONFIG_(ISO|QCOW2|VDI|VMDK|VHDX)_IMAGES)=y/# \1 is not set/' .config

          FMT_ARGS=""
          for f in ${FORMATS//,/ }; do
            case "$f" in
              iso)   FMT_ARGS="$FMT_ARGS CONFIG_ISO_IMAGES=y" ;;
              qcow2) FMT_ARGS="$FMT_ARGS CONFIG_QCOW2_IMAGES=y" ;;
              vdi)   FMT_ARGS="$FMT_ARGS CONFIG_VDI_IMAGES=y" ;;
              vmdk)  FMT_ARGS="$FMT_ARGS CONFIG_VMDK_IMAGES=y" ;;
              vhdx)  FMT_ARGS="$FMT_ARGS CONFIG_VHDX_IMAGES=y" ;;
              img)   ;;  # img 是默认产物，无需开关
            esac
          done

          PKGS="$(cat /tmp/packages.txt)"

          echo "PACKAGES: ${PKGS}"
          echo "格式参数: ${FMT_ARGS}"

          set -x
          make image \
            PROFILE="generic" \
            FILES="$(pwd)/files" \
            ROOTFS_PARTSIZE="${ROOTFS_SIZE}" \
            ${FMT_ARGS} \
            PACKAGES="${PKGS}"

      # ---------------------------------------------------------------- 发布 --
      - name: 生成说明
        run: |
          set -euo pipefail
          {
            echo "## ImmortalWrt ${VER} (${PKG})"
            echo
            echo "- 后台地址：http://${ROUTER_IP}"
            echo "- 用户名 / 密码：root / 无"
            echo "- 软件包空间：${ROOTFS_SIZE} MB"
            echo "- 固件格式：${FORMATS}"
            echo "- 包管理器：${PKG}"
            if [ "$ENABLE_PPPOE" = "true" ]; then
              echo "- 已预置 PPPoE 拨号账号（WAN）"
            else
              echo "- WAN 默认 DHCP"
            fi
            echo
            echo "<details><summary>预装插件（点击展开）</summary>"
            echo
            echo '```'
            jq -r '.packages[]' /tmp/plan.json
            echo '```'
            echo
            echo "</details>"
          } > router-info.md
          cat router-info.md

      - name: 整理产物
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out"
          SRC="$GITHUB_WORKSPACE/ib/bin/targets/x86/64"
          mkdir -p "$OUT"
          cd "$SRC"
          ls -la | head -40

          want() { case ",${FORMATS}," in *",$1,"*) return 0 ;; *) return 1 ;; esac; }

          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in
              *combined*.img.gz)
                want img || continue
                case "$FILESYSTEM" in
                  squashfs) case "$f" in *squashfs*) ;; *) continue ;; esac ;;
                  ext4)     case "$f" in *ext4*)     ;; *) continue ;; esac ;;
                esac
                ;;
              *.iso|*.iso.gz)       want iso   || continue ;;
              *.qcow2|*.qcow2.gz)   want qcow2 || continue ;;
              *.vmdk|*.vmdk.gz)     want vmdk  || continue ;;
              *.vdi|*.vdi.gz)       want vdi   || continue ;;
              *.vhdx|*.vhdx.gz)     want vhdx  || continue ;;
              *) continue ;;
            esac
            cp -f "$f" "$OUT/"
            echo "  + $f"
          done

          cd "$OUT"
          if [ -z "$(ls -A .)" ]; then
            echo "::error::没有收集到任何固件产物，请检查格式与文件系统参数"
            exit 1
          fi
          sha256sum ./* > /tmp/sums.txt
          mv /tmp/sums.txt sha256sums.txt
          ls -lh

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Autobuild-x86-64
          body_path: router-info.md
          files: out/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
