name: Build ImmortalWrt x86_64

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本（25.12.x=apk / 24.10.x=ipk，官方无 24.19）"
        required: true
        default: "25.12.2"
        type: choice
        options:
          - "25.12.2"
          - "25.12.1"
          - "25.12.0"
          - "24.10.6"
      custom_router_ip:
        description: "设置路由器管理地址 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "10.10.1.1"
      profile:
        description: "选择软件包空间大小"
        required: true
        default: "1G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"
      filesystem:
        description: "发布固件格式"
        required: true
        default: "both"
        type: choice
        options:
          - "both"
          - "squashfs"
          - "ext4"
      include_argon_config:
        description: "附加 argon-config（argon 主题配置插件）"
        default: true
        type: boolean
      include_singbox_easy:
        description: "附加 sing-box-easy（仅 ipk/24.10 可用，25.12 自动跳过）"
        default: false
        type: boolean
      remove_ppp:
        description: "移除 PPP/PPPoE 组件（需要拨号请保持关闭）"
        default: false
        type: boolean
      bandix_tag:
        description: "bandix 版本 tag"
        required: true
        default: "v0.12.12"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 解析版本 / 包格式 / 固件大小
        id: meta
        run: |
          VER="${{ inputs.luci_version }}"
          case "$VER" in
            25.12*) PKG=apk; BRANCH=openwrt-25.12 ;;
            *)      PKG=ipk; BRANCH=openwrt-24.10 ;;
          esac
          profile="${{ inputs.profile }}"
          case "$profile" in
            1G) ROOTFS_SIZE=1024 ;;
            2G) ROOTFS_SIZE=2048 ;;
            3G) ROOTFS_SIZE=3072 ;;
            4G) ROOTFS_SIZE=4096 ;;
          esac
          echo "pkg=${PKG}"            >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}"      >> "$GITHUB_OUTPUT"
          echo "rootfs_size=${ROOTFS_SIZE}" >> "$GITHUB_OUTPUT"
          echo "版本: $VER | 包管理: $PKG | 分支: $BRANCH | 固件大小: $profile ($ROOTFS_SIZE MB)"

      - name: 下载并解压官方 ImageBuilder
        run: |
          VER="${{ inputs.luci_version }}"
          curl -fL --retry 3 -o ib.tar.zst \
            "https://downloads.immortalwrt.org/releases/${VER}/targets/x86/64/immortalwrt-imagebuilder-${VER}-x86-64.Linux-x86_64.tar.zst"
          tar --zstd -xf ib.tar.zst
          mv immortalwrt-imagebuilder-* ib
          ls ib | head

      - name: 添加第三方源（nikki / momo）与签名密钥
        working-directory: ib
        run: |
          PKG="${{ steps.meta.outputs.pkg }}"
          BRANCH="${{ steps.meta.outputs.branch }}"
          mkdir -p keys
          if [ "$PKG" = "apk" ]; then
            # apk 版 ImageBuilder：仓库文件为 repositories，每行一个 packages.adb 地址
            echo "https://nikkinikki.pages.dev/${BRANCH}/x86_64/nikki/packages.adb" >> repositories
            echo "https://momomomo.pages.dev/${BRANCH}/x86_64/momo/packages.adb"   >> repositories
            curl -fL --retry 3 -o keys/nikki.pem "https://nikkinikki.pages.dev/public-key.pem"
            curl -fL --retry 3 -o keys/momo.pem  "https://momomomo.pages.dev/public-key.pem"
            cat repositories
          else
            # opkg 版 ImageBuilder：仓库文件为 repositories.conf
            printf 'src/gz nikki https://nikkinikki.pages.dev/%s/x86_64/nikki\n' "$BRANCH" >> repositories.conf
            printf 'src/gz momo https://momomomo.pages.dev/%s/x86_64/momo\n'   "$BRANCH" >> repositories.conf
            curl -fL --retry 3 -o keys/nikki.pub "https://nikkinikki.pages.dev/key-build.pub"
            curl -fL --retry 3 -o keys/momo.pub  "https://momomomo.pages.dev/key-build.pub"
            cat repositories.conf
          fi

      - name: Save Custom Router IP into uci-defaults
        run: |
          mkdir -p ib/files/etc/uci-defaults
          ROUTER_IP="${{ inputs.custom_router_ip }}"
          cat > ib/files/etc/uci-defaults/99-custom.sh <<EOF
          #!/bin/sh
          # 默认中文界面 + argon 主题
          uci set luci.main.lang='zh_cn'
          uci set luci.main.mediaurlbase='/luci-static/argon'
          uci commit luci
          # 管理地址（仅多网口机型生效）
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='${ROUTER_IP}'
          uci set network.lan.netmask='255.255.255.0'
          # ===== PPPoE 拨号预设（构建时不需要填）=====
          # 固件内置完整 PPPoE 组件；把账号密码填到下面两行引号内即可启用（留空 = WAN 保持 DHCP）
          # 已开机后想启用：直接在路由器上执行
          #   uci set network.wan.proto='pppoe'; uci set network.wan.username='账号'; uci set network.wan.password='密码'; uci commit network; /etc/init.d/network restart
          PPPOE_USER=''
          PPPOE_PASS=''
          if [ -n "\$PPPOE_USER" ]; then
            uci set network.wan.proto='pppoe'
            uci set network.wan.username="\$PPPOE_USER"
            uci set network.wan.password="\$PPPOE_PASS"
            uci -q delete network.wan6
            uci commit network
          fi
          uci commit network
          exit 0
          EOF
          chmod +x ib/files/etc/uci-defaults/99-custom.sh
          cat ib/files/etc/uci-defaults/99-custom.sh

      - name: 下载本地插件包（OpenClash 追新 / bandix / argon-config / sing-box-easy）
        working-directory: ib/packages
        run: |
          PKG="${{ steps.meta.outputs.pkg }}"
          dl() { curl -fL --retry 3 -o "$2" "$1" && echo "OK  $2" || echo "SKIP $1"; }

          # ---- bandix（本地包，必须成功）----
          BANDIX_URL=$(curl -sL "https://api.github.com/repos/timsaya/openwrt-bandix/releases/tags/${{ inputs.bandix_tag }}" \
            | jq -r '.assets[].browser_download_url' \
            | grep "x86_64\.${PKG}$" | head -1)
          [ -n "$BANDIX_URL" ] && dl "$BANDIX_URL" "$(basename "$BANDIX_URL")" || { echo "::error::bandix ${PKG} 包未找到"; exit 1; }

          # ---- luci-app-bandix 界面（timsaya/luci-app-bandix，与后端同版本号）----
          LUCI_BANDIX_VER="${{ inputs.bandix_tag }}-r5"
          LUCI_BANDIX_URL=$(curl -sL "https://api.github.com/repos/timsaya/luci-app-bandix/releases/tags/${LUCI_BANDIX_VER}" \
            | jq -r '.assets[].browser_download_url' \
            | grep "luci-app-bandix-.*\.${PKG}$" | head -1)
          LUCI_BANDIX_I18N_URL=$(curl -sL "https://api.github.com/repos/timsaya/luci-app-bandix/releases/tags/${LUCI_BANDIX_VER}" \
            | jq -r '.assets[].browser_download_url' \
            | grep "luci-i18n-bandix-zh-cn-.*\.${PKG}$" | head -1)
          [ -n "$LUCI_BANDIX_URL" ] && dl "$LUCI_BANDIX_URL" "$(basename "$LUCI_BANDIX_URL")" || { echo "::error::luci-app-bandix ${LUCI_BANDIX_VER} 未找到"; exit 1; }
          [ -n "$LUCI_BANDIX_I18N_URL" ] && dl "$LUCI_BANDIX_I18N_URL" "$(basename "$LUCI_BANDIX_I18N_URL")" || echo "WARN bandix 中文包未找到，跳过"
          ls -la bandix* luci-app-bandix* luci-i18n-bandix* 2>/dev/null || true

          # ---- OpenClash 追新（失败则回退官方源版本）----
          OC_URL=$(curl -sL "https://api.github.com/repos/vernesong/OpenClash/releases/latest" \
            | jq -r '.assets[].browser_download_url' \
            | grep "\.${PKG}$" | head -1)
          [ -n "$OC_URL" ] && dl "$OC_URL" "$(basename "$OC_URL")" || echo "OpenClash 使用官方源版本"

          # ---- argon-config（失败则仅保留官方源 argon 主题）----
          if [ "${{ inputs.include_argon_config }}" = "true" ]; then
            AC_URL=$(curl -sL "https://api.github.com/repos/jerrykuku/luci-theme-argon/releases/latest" \
              | jq -r '.assets[].browser_download_url' \
              | grep "luci-app-argon-config" | grep -v "i18n" | grep "\.${PKG}$" | head -1)
            [ -n "$AC_URL" ] && dl "$AC_URL" "$(basename "$AC_URL")" || echo "argon-config 下载失败，跳过"
          fi

          # ---- sing-box-easy（仅 ipk）----
          if [ "${{ inputs.include_singbox_easy }}" = "true" ] && [ "$PKG" = "ipk" ]; then
            SBE_URL=$(curl -sL "https://api.github.com/repos/SealinGp/sing-box-easy/releases/latest" \
              | jq -r '.assets[].browser_download_url' \
              | grep "sing-box-easy_.*_x86_64\.ipk$" | head -1)
            [ -n "$SBE_URL" ] && dl "$SBE_URL" "$(basename "$SBE_URL")" || echo "sing-box-easy 下载失败，跳过"
          elif [ "${{ inputs.include_singbox_easy }}" = "true" ]; then
            echo "::warning::sing-box-easy 仅提供 ipk，25.12 (apk) 自动跳过"
          fi

          # apk3 要求本地包文件名规范为 <name>-<version>.apk，去掉 _x86_64 / _all 架构后缀
          # （放在所有下载完成之后统一处理）
          for f in *_x86_64.apk *_all.apk; do
            [ -e "$f" ] || continue
            n="${f//_x86_64/}"; n="${n//_all/}"
            [ "$n" != "$f" ] && mv -f "$f" "$n"
          done

          ls -la

      - name: 构建固件
        working-directory: ib
        run: |
          set -x
          # 只保留 img 镜像：关闭 iso/qcow2/vdi/vmdk/vhdx（ImmortalWrt 额外有 QCOW2 开关）
          sed -i -E 's/^(CONFIG_(ISO|QCOW2|VDI|VMDK|VHDX)_IMAGES)=y/# \1 is not set/' .config
          # ===== 基础包（参考 wukongdaily 构建清单）=====
          PKGS=""
          PKGS="$PKGS curl"
          PKGS="$PKGS luci-i18n-diskman-zh-cn"
          PKGS="$PKGS luci-i18n-firewall-zh-cn"
          PKGS="$PKGS luci-theme-argon"
          PKGS="$PKGS luci-i18n-package-manager-zh-cn"
          PKGS="$PKGS luci-i18n-ttyd-zh-cn"
          PKGS="$PKGS openssh-sftp-server"
          PKGS="$PKGS luci-i18n-filemanager-zh-cn"
          PKGS="$PKGS luci-i18n-base-zh-cn"

          # ===== dnsmasq-full（OpenClash 依赖）=====
          PKGS="$PKGS -dnsmasq dnsmasq-full"
          PKGS="$PKGS bash ca-bundle ip-full unzip coreutils-nohup ruby ruby-yaml"
          PKGS="$PKGS kmod-tun kmod-inet-diag kmod-nft-tproxy kmod-nft-socket luci-compat"

          # ===== 代理插件 =====
          PKGS="$PKGS luci-app-openclash"
          PKGS="$PKGS nikki luci-app-nikki luci-i18n-nikki-zh-cn"
          PKGS="$PKGS momo luci-app-momo luci-i18n-momo-zh-cn"
          PKGS="$PKGS luci-app-homeproxy luci-i18n-homeproxy-zh-cn sing-box"
          PKGS="$PKGS bandix luci-app-bandix luci-i18n-bandix-zh-cn"

          if [ "${{ inputs.include_argon_config }}" = "true" ]; then
            PKGS="$PKGS luci-app-argon-config luci-i18n-argon-config-zh-cn"
          fi
          if [ "${{ inputs.include_singbox_easy }}" = "true" ] && [ "${{ steps.meta.outputs.pkg }}" = "ipk" ]; then
            PKGS="$PKGS sing-box-easy"
          fi
          if [ "${{ inputs.remove_ppp }}" = "true" ]; then
            PKGS=" -ppp -ppp-mod-pppoe ${PKGS}"
          fi

          echo "PACKAGES: ${PKGS}"
          make image PROFILE="generic" \
            FILES="$(pwd)/files" \
            ROOTFS_PARTSIZE="${{ steps.meta.outputs.rootfs_size }}" \
            CONFIG_ISO_IMAGES= CONFIG_QCOW2_IMAGES= CONFIG_VDI_IMAGES= CONFIG_VMDK_IMAGES= CONFIG_VHDX_IMAGES= \
            PACKAGES="${PKGS}"
          ls -la bin/targets/x86/64/

      - name: Create info
        run: |
          cat > router-info.md <<EOF
          ## 📡 固件信息
          - 版本: ImmortalWrt ${{ inputs.luci_version }}（x86_64）
          - 包管理: ${{ steps.meta.outputs.pkg == 'apk' && 'apk (25.12)' || 'opkg (24.10)' }}
          - 软件包空间: ${{ inputs.profile }}（ROOTFS_PARTSIZE=${{ steps.meta.outputs.rootfs_size }}）
          - 格式: ${{ inputs.filesystem }}
          - 🏠 **后台地址**: ${{ inputs.custom_router_ip }}
          - 👤 **用户名**: root　🔑 **密码**: 无

          ## 内置插件
          - OpenClash（官方源版本，mihomo 内核与 GeoData 可在插件内按需更新）
          - nikki / momo（官方 feed 最新版，内核可在插件内按需下载）
          - Homeproxy
          - bandix ${{ inputs.bandix_tag }}
          - argon 主题${{ inputs.include_argon_config == true && ' + argon-config' || '' }}、ttyd、文件管理器、package-manager、sftp-server
          ${{ inputs.include_singbox_easy == true && '- sing-box-easy' || '' }}

          ## 说明
          - WAN 默认 DHCP，固件不含 PPP/PPPoE
          - squashfs 版支持 LuCI 恢复出厂；ext4 版可离线扩容根分区
          - 多代理插件同时安装仅为预置，同一时间只能有一个插件接管流量
          EOF
          cat router-info.md

      - name: 整理产物
        run: |
          mkdir -p out
          case "${{ inputs.filesystem }}" in
            squashfs) PATTERN="*squashfs-combined*" ;;
            ext4)     PATTERN="*ext4-combined*" ;;
            *)        PATTERN="*combined*" ;;
          esac
          cp ib/bin/targets/x86/64/${PATTERN}.img.gz out/ 2>/dev/null
          [ -n "$(ls -A out 2>/dev/null)" ] || { echo "::error::未找到固件产物"; exit 1; }
          cd out && sha256sum * > sha256sums.txt && cd ..
          ls -la out

      - name: Upload ImmortalWrt as release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Autobuild-x86-64
          body_path: router-info.md
          files: out/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
